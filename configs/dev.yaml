# Config format version; the parser only accepts the currently explicitly supported versions.
schema_version: 1

# The Dev Set is used for connectivity checks and parameter tuning; do not mark the config frozen until it passes.
experiment:
  name: local-qwen35-9b-dev
  phase: dev
  random_seed: 42
  configuration_frozen: false

# tasks_file stores only development task IDs; it must not contain reference patches or hidden test content.
dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/dev_tasks.json

# Ollama runs the open-source model locally; Dev verification confirmed it can produce structured tool_use through Claude Code.
# context_length is fixed at 32768; max_output_tokens reserves 24K of input space to avoid the unknown model's default
# 32K output budget repeatedly triggering Claude Code auto-compact.
model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

# timeout_seconds is the wall-clock time limit for the full Agent run on each task.
agent:
  framework: claude-code
  timeout_seconds: 5400
  max_turns: 30
  prompt_template: prompts/swe_agent_prompt.txt

# Networking is only allowed during the preparation phase; formal solving must be offline to avoid retrieving ready-made answers.
network:
  environment_preparation: true
  formal_solving: false

# A single worker prioritizes stable local development; cache_level controls the scope of Docker image reuse.
evaluation:
  max_workers: 1
  cache_level: env

# All paths are relative to the project root, making it easy to migrate between a lightweight laptop and the 4070 host.
storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
