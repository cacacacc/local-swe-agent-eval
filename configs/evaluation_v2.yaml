# Architecture ablation config: kept and reported separately from the formal baseline in evaluation.yaml.
schema_version: 1

# All three Dev v2 tasks have been run, with the official result 2 resolved / 1 unresolved; what is frozen here is
# the scheduling architecture, not a success-rate guarantee. The ten-task results must not replace the original 20% formal result.
experiment:
  name: local-qwen35-9b-evaluation-v2
  phase: evaluation
  random_seed: 42
  configuration_frozen: true

dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/evaluation_tasks.json

# Keep the model unchanged so differences come mainly from the 30+10 dual-session and the parent-process visible test sandbox.
model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

agent:
  framework: claude-code
  timeout_seconds: 5400
  # The per-task total wall-clock budget covers both the model and Docker phases, preventing multiple partial timeouts from cascading out of control.
  task_timeout_seconds: 1800
  max_turns: 40
  verification_turns: 10
  test_planning_turns: 0
  max_file_read_lines: 200
  max_tool_output_chars: 12000
  visible_test_sandbox: true
  visible_test_timeout_seconds: 900
  visible_regression_test_timeout_seconds: 300
  prompt_template: prompts/swe_agent_prompt_v2.txt

network:
  environment_preparation: true
  formal_solving: false

evaluation:
  max_workers: 2
  cache_level: env

storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
