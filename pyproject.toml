[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-swe-agent-eval"
version = "0.1.0"
description = "A reproducible local-LLM agent evaluation pipeline for SWE-bench Verified."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
huggingface = ["datasets>=2.19"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.setuptools.packages.find]
include = ["agent*", "benchmark*", "experiment*", "scripts*", "tracking*"]
