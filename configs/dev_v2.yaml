# 架构改进实验使用独立 Dev 配置；原 evaluation.yaml 对应已完成的正式基线，禁止改写。
schema_version: 1

experiment:
  name: local-qwen35-9b-dev-v2
  phase: dev
  random_seed: 42
  configuration_frozen: false

# 沿用原三题 Dev Set，便于把架构变化与既有运行做可比分析。
dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/dev_tasks.json

# 模型本身保持不变，将结果差异主要归因于 Agent 编排而不是模型替换。
model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

# 44 是硬上限：先用 4 turns 规划并运行基线测试，再用 30 turns 实现，最后用 10 turns 验证和修复。
# 文件与输出限制先作为可审计 Prompt 协议，后续再根据 Dev 轨迹决定是否增加 CLI hook 硬限制。
agent:
  framework: claude-code
  timeout_seconds: 5400
  max_turns: 44
  verification_turns: 10
  test_planning_turns: 4
  max_file_read_lines: 200
  max_tool_output_chars: 12000
  # Agent 只能把自己的 patch 放进无网络官方镜像，不能接触 hidden test patch。
  visible_test_sandbox: true
  visible_test_timeout_seconds: 900
  prompt_template: prompts/swe_agent_prompt_v2.txt

network:
  environment_preparation: true
  formal_solving: false

evaluation:
  max_workers: 1
  cache_level: env

storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
