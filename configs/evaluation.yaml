# Config format version; the parser only accepts the currently explicitly supported versions.
schema_version: 1

# The three Dev tasks are complete and judged resolved by the official harness; the formal ten tasks use this frozen config.
experiment:
  name: local-qwen35-9b-evaluation
  phase: evaluation
  random_seed: 42
  configuration_frozen: true

# The formal task list must be fixed in advance; failed tasks must not be swapped out based on run results.
dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/evaluation_tasks.json

# Model parameters must match the locally validated Dev model and the final report; any change produces a new fingerprint.
# Frozen after the three Dev tasks were completed; this model parameter group must not be modified during the formal run.
# The 8K output cap preserves at least 24K of context for tool results and subsequent turns, preventing auto-compact churn.
model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

# Each task uses the same Agent, timeout, and Prompt to control experimental variables across tasks.
agent:
  framework: claude-code
  timeout_seconds: 5400
  max_turns: 30
  prompt_template: prompts/swe_agent_prompt.txt

# The environment should be prepared in advance; external network access is forbidden during Agent solving.
network:
  environment_preparation: true
  formal_solving: false

# Concurrency and cache settings affect hardware load, so they belong to the frozen experiment configuration.
evaluation:
  max_workers: 2
  cache_level: env

# Artifacts and caches use project-relative paths so the config can be reproduced on another machine.
storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
