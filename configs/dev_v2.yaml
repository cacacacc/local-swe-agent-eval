# The architecture-improvement experiment uses a separate Dev config; the original evaluation.yaml corresponds to a completed formal baseline and must not be modified.
schema_version: 1

experiment:
  name: local-qwen35-9b-dev-v2
  phase: dev
  random_seed: 42
  configuration_frozen: false

# Reuse the original three-task Dev Set so architecture changes can be compared against existing runs.
dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/dev_tasks.json

# Keep the model itself unchanged, attributing result differences mainly to Agent orchestration rather than model replacement.
model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

# 40 is the hard ceiling: 30 turns for implementation, deterministic parent-process test planning and running, and 10 turns for verification and fixing.
# File and output limits start as an auditable Prompt protocol; later, based on Dev trajectories, decide whether to add CLI hook hard limits.
agent:
  framework: claude-code
  timeout_seconds: 5400
  # Dev and the formal v2 use the same 30-minute total wall-clock boundary per task.
  task_timeout_seconds: 1800
  max_turns: 40
  verification_turns: 10
  test_planning_turns: 0
  max_file_read_lines: 200
  max_tool_output_chars: 12000
  # The Agent can only put its own patch into the offline official image and cannot touch the hidden test patch.
  visible_test_sandbox: true
  visible_test_timeout_seconds: 900
  # Adjacent regression tests are usually broader than the target test, so they are separately limited to 5 minutes.
  visible_regression_test_timeout_seconds: 300
  prompt_template: prompts/swe_agent_prompt_v2.txt

network:
  environment_preparation: true
  formal_solving: false

evaluation:
  max_workers: 1
  cache_level: env

storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
