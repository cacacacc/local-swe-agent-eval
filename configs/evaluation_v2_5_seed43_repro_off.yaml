# Five previously resolved seed-43 tasks that regressed in the issue-reproduction run.
# The off arm removes the issue-reproduction instruction and Docker execution.
schema_version: 1

experiment:
  name: local-qwen35-9b-seed43-repro-ablation
  phase: evaluation
  random_seed: 43
  configuration_frozen: true

dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/evaluation_tasks_5_seed43_regressions.json

model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

agent:
  framework: claude-code
  timeout_seconds: 5400
  task_timeout_seconds: 1800
  max_turns: 40
  verification_turns: 10
  test_planning_turns: 0
  max_file_read_lines: 200
  max_tool_output_chars: 12000
  visible_test_sandbox: true
  visible_test_timeout_seconds: 900
  visible_regression_test_timeout_seconds: 300
  # This is the only agent parameter that differs from the paired on config.
  issue_reproduction_enabled: false
  prompt_template: prompts/swe_agent_prompt_v2.txt

network:
  environment_preparation: true
  formal_solving: false

evaluation:
  max_workers: 2
  cache_level: env

storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
