# Fourth extended evaluation config: exclude the existing 78 mutually non-overlapping fixed tasks in the repository,
# then draw 30 tasks without replacement using seed 43 over the 422 sorted candidate instance IDs.
schema_version: 1

experiment:
  name: local-qwen35-9b-evaluation-v2-30-seed43
  phase: evaluation
  random_seed: 43
  configuration_frozen: true

dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/evaluation_tasks_30_seed43.json

# Keep the total at 40 turns: 30 turns for Implementation plus 10 turns for Verification/Recovery.
# Recovery of an empty patch first goes through a 2-turn gate that only opens Edit; when the parent process detects
# a new_regression, Verification opens only Read/Edit for focused fixing.
model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

agent:
  framework: claude-code
  timeout_seconds: 5400
  # The per-task total wall clock is at most 30 minutes, covering the cumulative time of model sessions and parent-process Docker tests.
  task_timeout_seconds: 1800
  max_turns: 40
  verification_turns: 10
  test_planning_turns: 0
  max_file_read_lines: 200
  max_tool_output_chars: 12000
  visible_test_sandbox: true
  # The target test keeps 15 minutes; the broader adjacent regression tests wait at most 5 minutes.
  visible_test_timeout_seconds: 900
  visible_regression_test_timeout_seconds: 300
  prompt_template: prompts/swe_agent_prompt_v2.txt

network:
  environment_preparation: true
  formal_solving: false

evaluation:
  max_workers: 2
  cache_level: env

storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
