# Extended evaluation config: from the SWE-bench Verified candidate set after excluding the existing 13 tasks,
# draw 15 tasks without replacement using seed 42 over the sorted instance IDs.
schema_version: 1

experiment:
  name: local-qwen35-9b-evaluation-v2-15-seed42
  phase: evaluation
  random_seed: 42
  configuration_frozen: true

dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/evaluation_tasks_15_seed42.json

# Keep the same model as the ten-task v2, using the 30+10 dual-session budget; the test plan is generated by the parent process.
model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

agent:
  framework: claude-code
  timeout_seconds: 5400
  task_timeout_seconds: 1800
  max_turns: 40
  verification_turns: 10
  test_planning_turns: 0
  max_file_read_lines: 200
  max_tool_output_chars: 12000
  visible_test_sandbox: true
  visible_test_timeout_seconds: 900
  visible_regression_test_timeout_seconds: 300
  prompt_template: prompts/swe_agent_prompt_v2.txt

network:
  environment_preparation: true
  formal_solving: false

evaluation:
  max_workers: 2
  cache_level: env

storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
