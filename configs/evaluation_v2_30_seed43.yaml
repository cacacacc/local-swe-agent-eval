# 第四组扩展评测配置：排除仓库中既有且互不重叠的 78 道固定题，
# 再对排序后的 422 个候选 instance ID 使用 seed 43 无放回抽取 30 题。
schema_version: 1

experiment:
  name: local-qwen35-9b-evaluation-v2-30-seed43
  phase: evaluation
  random_seed: 43
  configuration_frozen: true

dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  tasks_file: experiments/evaluation_tasks_30_seed43.json

# 保持总计 40 turns：30 turns Implementation 加 10 turns Verification/Recovery。
# 空 patch 的 Recovery 先经过仅开放 Edit 的 2-turn gate；父进程检测到
# new_regression 时，Verification 只开放 Read/Edit 进行聚焦修复。
model:
  runtime: ollama
  name: qwen3.5:9b
  context_length: 32768
  max_output_tokens: 8192

agent:
  framework: claude-code
  timeout_seconds: 5400
  max_turns: 40
  verification_turns: 10
  test_planning_turns: 0
  max_file_read_lines: 200
  max_tool_output_chars: 12000
  visible_test_sandbox: true
  visible_test_timeout_seconds: 900
  prompt_template: prompts/swe_agent_prompt_v2.txt

network:
  environment_preparation: true
  formal_solving: false

evaluation:
  max_workers: 2
  cache_level: env

storage:
  repository_cache: repo-cache
  workspaces: workspaces
  runs: runs
